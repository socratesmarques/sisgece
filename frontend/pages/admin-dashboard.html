<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISGECE - Coordenação</title>
    <link rel="stylesheet" href="../assets/css/admin-dashboard.css">
</head>
<body>
    <header><div><h1>SISGECE</h1><p>Painel da Coordenação · <span id="usuario"></span></p></div><button id="logout">Sair</button></header>
    <main>
        <p id="aviso" role="status" aria-live="polite"></p>
        <section class="solicitacao">
            <h2>Registrar solicitação</h2>
            <p>Uso da equipe autorizada. O estudante deve estar previamente cadastrado pela instituição.</p>
            <form id="solicitacao-form">
                <label>Matrícula<input name="matricula" required maxlength="80" autocomplete="off"></label>
                <label>Tipo<select name="tipo" required><option>Saída antecipada</option><option>Saída em horário regular</option></select></label>
                <label>Justificativa<textarea name="justificativa" required maxlength="2000"></textarea></label>
                <label>Data<input name="data_solicitada" type="date" required></label>
                <label>Horário<input name="horario_solicitado" type="time" required></label>
                <button type="submit">Salvar solicitação</button>
            </form>
        </section>
        <h2>Solicitações</h2>
        <label><input id="historico" type="checkbox"> Incluir analisadas (até 500 registros mais recentes)</label>
        <button id="atualizar">Atualizar</button>
        <div id="solicitacoes" aria-live="polite">Carregando...</div>
    </main>
    <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
