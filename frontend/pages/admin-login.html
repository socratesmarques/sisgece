<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SISGECE - Coordenação</title>

    <link rel="stylesheet" href="../assets/css/admin-login.css">
</head>

<body>

    <main class="container">

        <section class="login-box">

            <h1>SISGECE</h1>

            <p>Acesso da Coordenação</p>

            <form id="login-form">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

                <p id="erro"></p>

            </form>

        </section>

    </main>

    <script src="../assets/js/admin-login.js"></script>

</body>

</html>
