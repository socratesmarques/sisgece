name: PostgreSQL, API e navegador
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste-ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: teste-ci
      LOCAL_HTTP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright
      - run: python -m unittest discover -s tests -v
      - run: docker build -t sisgece:ci .
      - run: docker run -d --name web --network host -e PGHOST -e PGUSER -e PGPASSWORD -e LOCAL_HTTP sisgece:ci
      - run: curl --retry 15 --retry-all-errors --retry-delay 1 -fsS http://localhost:3000/api/ready
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
        env:
          TEST_URL: http://localhost:3000
