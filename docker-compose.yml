services:
  app:
    build: .
    container_name: sisgece-app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8004:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PGHOST: db
      PGPORT: "5432"
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET em backend/.env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: sisgece-db
    environment:
      POSTGRES_USER: ${PGUSER:?Configure PGUSER em backend/.env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Configure PGPASSWORD em backend/.env}
      POSTGRES_DB: ${PGDATABASE:?Configure PGDATABASE em backend/.env}
    volumes:
      - sisgece_postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  sisgece_postgres:
